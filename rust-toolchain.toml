# An exact release, not `stable`: a new Rust brings new lints, and CI
# denies warnings, so a floating channel fails whichever pull request is
# open on release day. Dependabot (rust-toolchain, .github/dependabot.yml)
# raises it in a pull request of its own, where the new lints are fixed.
# CI and the release workflow install what this file names
# (`rustup toolchain install`); the MSRV is `rust-version` in Cargo.toml,
# which CI's msrv job checks.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
