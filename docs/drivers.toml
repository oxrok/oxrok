# Per-driver facts for the oxrok.dev site (and the README tables).
#
# This is the file a person maintains. tools/site-data reads it, merges in
# the case counts and gcov figures from tests/emu, and fails the build if a
# driver has no entry here, so a new port cannot appear without its status.
#
# status: hardware, stand-in, emulated, replay, software, not-ported. A
# driver can hold more than one; the table shows the strongest, the page
# shows them all.
#   hardware   run on the real device, by us
#   stand-in   run over a real bus on a microcontroller acting as the device
#   emulated   compared with libsigrok on an emulated device; never on hardware
#   replay     checked only against recordings
#   software   a software driver, checked by the software cases of diffcli.sh
#   not-ported in libsigrok, not here yet
# kind: logic-analyzer, scope, meter, supply, load, generator, other
# connection: usb, serial, tcp, hid, none
# emu: the tests/emu model directories whose cases and gcov belong to this
#     driver. A family names every model directory it spans.
# evidence: what unit, what was run, when (hardware and stand-in rows).
# behaviour and limits: plain lines, in oxrok's terms. No line names what
# libsigrok gets wrong; where oxrok differs from sigrok-cli a user needs to
# know the behaviour, and it is stated with no judgement of the C.

[drivers.demo]
name = "Demo driver and pattern generator"
libsigrok = "demo"
ids = ["demo"]
kind = "other"
connection = "none"
vendor = ""
models = []
status = ["software"]
emu = []
evidence = []
behaviour = [
  "A software device with 13 channels (D0-D7, A0-A4); no hardware needed.",
  "Honours triggers: samples before the trigger are dropped and the trigger is marked.",
]
limits = [
  "The random analog channel (A4) differs from run to run in both tools.",
]

[drivers.intronix-logicport]
name = "Intronix LogicPort LA1034"
libsigrok = ""
ids = ["intronix-logicport"]
kind = "logic-analyzer"
connection = "usb"
vendor = "Intronix"
models = ["LA1034"]
status = ["hardware", "emulated"]
emu = ["intronix-logicport"]
evidence = [
  "Two LogicPort LA1034 units; 60 bench checks with an ESP32 signal generator.",
  "Emulated: 121 cases against the C driver of libsigrok pull request 315 and 33 for the extended triggers and options; both real recordings replay against the model byte for byte.",
]
behaviour = [
  "34 channels (D0-D31, CLK1, CLK2), 1 kHz to 500 MHz, state mode on CLK1 or CLK2, run length compression up to 200 MHz.",
  "Triggers take the extended forms (counts, durations, value ranges, or/and combines, two stages); options clock_qualifier, sample_point, invert, frequency_channel and frequency.",
  "Loads the FPGA image the settings need, and retries an upload that failed; a corrupt file, a wrong image or an FPGA whose init never finishes fails the capture.",
  "A --show on a cold device uploads an image, to measure the frequency.",
]
limits = [
  "Firmware is the vendor's LogicPort.ccf, unmodified, looked up in the firmware directories.",
  "The clock qualifier input check is still unverified (needs a wire from GPIO15 to CLK2).",
]

