name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Which slow jobs this run needs (tools/ci/changes.py). A push to main
  # runs everything. A pull request runs the emulator models of the
  # drivers, models and shells it changes, and the Python decoder jobs
  # only when it changes decoder code; core code, shared emulator code,
  # Cargo.lock, this file and any path the script does not know select
  # everything. The label `ci:full` selects everything too: add it, then
  # re-run all jobs. The step summary says what each path selected.
  # tests/emu_replay.rs replays every model in the test job regardless.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      emu: ${{ steps.select.outputs.emu }}
      emu_shards: ${{ steps.select.outputs.emu_shards }}
      python: ${{ steps.select.outputs.python }}
    steps:
      # A pull request checks out its merge commit: the first parent is
      # the base it merges into, so HEAD^1..HEAD is what it changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Labels read now, not from the event, so a re-run sees a new one.
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=
          if [ "$EVENT" = pull_request ]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name] | join(",")')
          fi
          python3 -I tools/ci/changes.py --event "$EVENT" --labels "$labels" --base HEAD^1 --head HEAD

  check:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: python3 -I tools/ci/test_changes.py
      - run: cargo clippy --workspace --all-targets --all-features

  # Fails on a dependency with a licence deny.toml does not allow, for any
  # feature on any platform. Licences only; see docs/LICENSING.md.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --workspace --locked check licenses
      # What the release generates, so that a new dependency that needs a
      # line in tools/third-party shows here and not on the release tag.
      - run: cargo install --locked --features cli --version 0.9.3 cargo-about
      - run: make notices-all

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo test --workspace --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rustpython needs 1.96, for its parser.
      - run: cargo check --workspace --features python,libusb

  # The suite under each Python feature, in nextest slices. The longest
  # single test (decoder_uart_rest's amulet_ascii regression, about four
  # minutes under CPython) is the floor of a slice; change `of` to
  # retune.
  python-decoders:
    name: python decoders (${{ matrix.feature }} ${{ matrix.slice }}/${{ matrix.of }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: python, slice: 1, of: 3 }
          - { feature: python, slice: 2, of: 3 }
          - { feature: python, slice: 3, of: 3 }
          - { feature: rustpython, slice: 1, of: 2 }
          - { feature: rustpython, slice: 2, of: 2 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.feature }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
      - if: matrix.feature == 'python'
        run: sudo apt-get update && sudo apt-get install -y python3-dev libsigrokdecode4
      - run: >-
          cargo nextest run -p oxrok --features ${{ matrix.feature }} --no-fail-fast
          --partition slice:${{ matrix.slice }}/${{ matrix.of }}

  python-clippy:
    name: python decoders (clippy)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y python3-dev
      - run: cargo clippy -p oxrok --features python --all-targets
      - run: cargo clippy -p oxrok --features rustpython --all-targets

  # The emulator tier (docs/USB.md, "Emulation over USB/IP"): oxrok
  # against the goldens sigrok-cli wrote, through vhci-hcd. When the
  # hosted kernel has no vhci-hcd, the probe says "skipped: no vhci-hcd"
  # and the emulator job shows as skipped, neither failed nor passed.
  # Two consequences to keep in mind: branch protection counts a skipped
  # required job as satisfied, so a runner without vhci-hcd lets a PR
  # merge with no emulator run at all; and the probe turns any failure
  # of its apt-get (a mirror down, a package renamed) into that same
  # skip, not into a failure. Check the step summary for the warning.
  # A pull request that changes no emulated driver or model skips it as
  # well, by design (the changes job above).
  emulator-probe:
    name: emulator (vhci-hcd probe)
    needs: changes
    if: needs.changes.outputs.emu == 'true'
    runs-on: ubuntu-latest
    outputs:
      vhci: ${{ steps.vhci.outputs.vhci }}
    steps:
      - id: vhci
        name: Load vhci-hcd
        run: |
          load() {
            [ -d /sys/devices/platform/vhci_hcd.0 ] && return 0
            sudo modprobe vhci-hcd 2>/dev/null && return 0
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" \
              && sudo modprobe vhci-hcd
          }
          if load && [ -d /sys/devices/platform/vhci_hcd.0 ]; then
            echo "vhci-hcd loaded on kernel $(uname -r)"
            echo "vhci=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning title=emulator tier skipped::skipped: no vhci-hcd on kernel $(uname -r)"
            echo "skipped: no vhci-hcd on kernel $(uname -r); the emulator tier did not run" >>"$GITHUB_STEP_SUMMARY"
            echo "vhci=false" >>"$GITHUB_OUTPUT"
          fi

  emulator:
    name: emulator (oxrok against the goldens, ${{ matrix.shard }})
    needs: [changes, emulator-probe]
    if: needs.emulator-probe.outputs.vhci == 'true'
    # One job takes over an hour. tools/ci/changes.py picks the models
    # and balances them over up to six jobs by golden case count; a new
    # model joins a shard by itself.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.emu_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The probe loaded it on the same image: here a failure is an error.
      - name: Load vhci-hcd
        run: |
          if [ ! -d /sys/devices/platform/vhci_hcd.0 ] && ! sudo modprobe vhci-hcd; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe vhci-hcd
          fi
          test -d /sys/devices/platform/vhci_hcd.0
      # The serial models' tty. Ubuntu's Azure kernels ship it in
      # linux-modules or in the extras, depending on the version.
      - name: Load cdc-acm
        run: |
          if ! sudo modprobe cdc-acm; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe cdc-acm
          fi
      # baylibre-acme binds its sysfs tree in a user namespace of each
      # tool's own; Ubuntu's AppArmor (24.04 on) refuses unprivileged ones.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # mooshimeter-dmm's virtual controller and hung-chang-dso-2100's
      # parallel port; bluetoothd would take the controller, so it stops.
      - name: Bluetooth and parallel port modules
        run: |
          sudo modprobe hci_vhci || true
          sudo modprobe -a ppdev uss720 || true
          sudo systemctl stop bluetooth 2>/dev/null || true
      - run: cargo build -p oxrok -p oxrok-emu
      # What the harness drives the server with.
      - run: cargo install vusb-cli --version 0.2.1 --locked
      # No sigrok-cli: full cases run oxrok alone against the committed
      # .out and .tx goldens, oracle-only cases are skipped and counted.
      # The harness runs oxrok-emu under sudo -n.
      - env:
          MODELS: ${{ matrix.models }}
        run: |
          echo "$MODELS"
          sh tools/diffcli.sh --no-oracle --emu-model "$MODELS"
