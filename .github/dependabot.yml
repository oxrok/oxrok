version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned for RustPython 0.6.0 (Cargo.toml): moved by hand with RustPython.
      - dependency-name: "malachite-bigint"
      - dependency-name: "rustpython-ruff_*"
    labels: [deps]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [deps]
