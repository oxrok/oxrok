[package]
name = "oxrok-emu"
description = "USB/IP device server: device models attached through vhci-hcd, so drivers are checked against sigrok-cli without the hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later OR Apache-2.0"
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "oxrok-emu"
path = "src/main.rs"

[dependencies]
aes = "0.9"
clap.workspace = true
ctrlc = { version = "3", features = ["termination"] }
serde_json = "1"
sha2 = "0.10"
vusb = "0.2.1"
# The Mooshimeter's zlib compressed config tree (models/mooshimeter-dmm.rs);
# oxrok's own flate2, so nothing new is built.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "linux")'.dependencies]
# One ioctl, HCIDEVUP, in main.rs for the --ble controller; already in the tree.
libc = "0.2"
# The sysfs carrier's inotify and poll (shells/sysfs.rs), safe wrappers, as
# the library forbids unsafe code; and the binary's gpib-config, whose ioctls on
# /dev/gpibN are its only unsafe calls (src/gpib_config.rs).
rustix = { version = "1.1", features = ["event", "fs"] }

[lints]
workspace = true
