# Packit builds oxrok in COPR from this repository: every pull request
# gets a scratch build, so the spec and the tree are proven together.
# packaging/README.md says how it is set up and what comes next.
specfile_path: packaging/fedora/oxrok.spec
upstream_package_name: oxrok
downstream_package_name: oxrok
upstream_tag_template: v{version}

# The SRPM is built from a vendored source tarball made here, not from a
# release asset, so a pull request builds what it changes.
srpm_build_deps:
  - make
  - cargo
  - git-core
  - xz
actions:
  create-archive:
    - make vendor-src
  get-current-version:
    - bash -c "sed -n 's/^version = \"\\(.*\\)\"/\\1/p' Cargo.toml | head -n 1"

# The targets are the chroots of the COPR project mangelajo/oxrok:
# every active Fedora with Rawhide, CentOS Stream 10 and EPEL 10 on RHEL,
# for x86_64 and aarch64. Both jobs inherit them.
targets:
  - fedora-all-x86_64
  - fedora-all-aarch64
  - centos-stream-10-x86_64
  - centos-stream-10-aarch64
  - rhel+epel-10-x86_64
  - rhel+epel-10-aarch64

jobs:
  # A pull request builds in Packit's own COPR namespace, one project per
  # pull request, so a contributor's change never reaches the repository
  # users install from.
  - job: copr_build
    trigger: pull_request
  # Every commit on main builds into mangelajo/oxrok, the repository users
  # enable with `dnf copr enable mangelajo/oxrok`.
  - job: copr_build
    trigger: commit
    branch: main
    owner: mangelajo
    project: oxrok
